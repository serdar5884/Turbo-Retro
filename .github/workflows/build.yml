name: Build APK + AAB
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build debug APK (telefona kurmak için)
        run: gradle assembleDebug --no-daemon
      - name: Prepare upload key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"; echo "TR_KEYSTORE=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"; else echo "::warning::KEYSTORE_BASE64 secret yok - AAB debug anahtarıyla imzalanacak, Play Store kabul etmez"; fi
      - name: Build release AAB (Google Play için)
        env:
          TR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle bundleRelease --no-daemon
      - name: Rename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TurboRetro.apk
          cp app/build/outputs/bundle/release/app-release.aab TurboRetro.aab
      - uses: actions/upload-artifact@v4
        with: { name: TurboRetro-build, path: "TurboRetro.apk\nTurboRetro.aab" }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Turbo Retro build ${{ github.run_number }}
          files: |
            TurboRetro.apk
            TurboRetro.aab
